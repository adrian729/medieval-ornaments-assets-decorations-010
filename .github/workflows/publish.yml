name: Publish approved resources
on:
  workflow_dispatch:
    inputs:
      check-authentication:
        description: Verify npm OIDC without publishing
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: resource-publication
  cancel-in-progress: false
jobs:
  publish:
    uses: adrian729/medieval-ornaments/.github/workflows/publish-resource.yml@b42732e9c2f57d7d5b8d1c96c006862538a00d3f
    with:
      source: decorations-010
      tooling-ref: b42732e9c2f57d7d5b8d1c96c006862538a00d3f
      check-authentication: ${{ inputs.check-authentication }}
